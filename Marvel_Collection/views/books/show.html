<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Results — Marvel Companion</title>
  <link rel="stylesheet" href="/css/showbooks.css">
</head>
<body>
  <nav class="navbar">
    <a href="/home" class="navbar-brand">Marvel Companion</a>
    <div class="nav-links">
      <a href="/books/search">Search Again</a>
      <a href="/user/logout">Logout</a>
    </div>
  </nav>

  <div class="results-header">
    <h2>Search Results</h2>
  </div>

  <div class="results-grid">
    {{#books}}
    <div class="card">
      <a href="/books/{{id}}" class="card-link">
        <img src="{{thumbnail.path}}.{{thumbnail.extension}}" alt="{{title}}">
      </a>
      <div class="card-body">
        <a href="/books/{{id}}" class="card-title-link"><h3>{{title}}</h3></a>
        <p>{{description}}</p>
        <form action="/books/home" method="POST">
          <input type="hidden" value="{{thumbnail.path}}.{{thumbnail.extension}}" name="thumbnail">
          <input type="hidden" value="{{id}}" name="id">
          <input type="hidden" value="{{title}}" name="title">
          <input type="hidden" value="{{description}}" name="description">
          <button type="submit" class="btn-favorite">+ Favorite</button>
        </form>
      </div>
    </div>
    {{/books}}
  </div>
</body>
</html>
