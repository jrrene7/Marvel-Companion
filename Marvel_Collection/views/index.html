<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Companion</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-card">
    <h1>Marvel Companion</h1>
    <form action="/user/login" method="post">
      <input placeholder="Email" name="user[email]" type="text">
      <input placeholder="Password" name="user[password]" type="password">
      <input type="submit" value="Login">
    </form>
    <a href="/user/new" class="btn-outline">Create Account</a>
  </div>
</body>
</html>
