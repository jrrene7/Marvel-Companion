<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Search — Marvel Companion</title>
  <link rel="stylesheet" href="/css/charactersearch.css">
</head>
<body>
  <nav class="navbar">
    <a href="/home" class="navbar-brand">Marvel Companion</a>
    <div class="nav-links">
      <a href="/characters/home">Favorites</a>
      <a href="/user/logout">Logout</a>
    </div>
  </nav>

  <div class="search-container">
    <h1>Search Characters</h1>
    <form action="/characters/show" method="POST">
      <input type="text" placeholder="Enter character name..." name="input" autofocus>
      <button type="submit" class="btn-primary">Search</button>
    </form>
  </div>
</body>
</html>
