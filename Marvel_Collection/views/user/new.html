<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Marvel Companion</title>
  <link rel="stylesheet" href="/css/new.css">
</head>
<body>
  <div class="login-card">
    <h1>Create Account</h1>
    <form action="/user" method="POST">
      <label for="email">Email</label>
      <input id="email" type="text" name="user[email]" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" name="user[password]" placeholder="Password">
      <input type="submit" value="Sign Up">
    </form>
    <a href="/" class="btn-outline">Back to Login</a>
  </div>
</body>
</html>
